version: 2

# No groups: every outdated package gets its own PR, reviewed and merged on its own.

updates:
  - package-ecosystem: npm
    directories: ["/", "/worker", "/proxy"]
    target-branch: dev
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: America/Denver
    cooldown:
      default-days: 14
    open-pull-requests-limit: 20
    commit-message:
      prefix: "deps"
    # Majors of these break the next-on-pages build; they wait for the OpenNext move.
    ignore:
      - dependency-name: "next"
        update-types: ["version-update:semver-major"]
      - dependency-name: "eslint-config-next"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@mantine/*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
      - dependency-name: "eslint"
        update-types: ["version-update:semver-major"]
      - dependency-name: "react"
        update-types: ["version-update:semver-major"]
      - dependency-name: "react-dom"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@types/react"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@types/react-dom"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@cloudflare/workers-types"
        update-types: ["version-update:semver-major"]
      # 4.108+ wants workers-types 5, which next-on-pages rejects.
      - dependency-name: "wrangler"
        versions: [">=4.108.0"]

  - package-ecosystem: github-actions
    directory: /
    target-branch: dev
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: America/Denver
    cooldown:
      default-days: 14
    open-pull-requests-limit: 20
    commit-message:
      prefix: "ci"
